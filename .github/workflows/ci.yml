name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, infrastructure-setup]
  pull_request:
    branches: [main]

jobs:
  # Stage 1: Lint and Test
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci
      
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Lint Backend
        run: |
          cd backend
          npm run lint --if-present
      
      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint --if-present
      
      - name: Test Backend
        run: |
          cd backend
          npm test --if-present

  # Stage 2: Security Scan
  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail on vulnerabilities for learning

  # Stage 3: Build Docker Images
  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Backend Image
        run: docker build -t equipment-backend:${{ github.sha }} ./backend
      
      - name: Build Frontend Image
        run: docker build -t equipment-frontend:${{ github.sha }} ./frontend
      
      # For a real deployment, we would push these to a registry (Docker Hub/ECR)
      # Since this is local learning, we save them as artifacts to prove it works
      - name: Save images as artifacts
        run: |
          docker save equipment-backend:${{ github.sha }} > backend-image.tar
          docker save equipment-frontend:${{ github.sha }} > frontend-image.tar
      
      - uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            backend-image.tar
            frontend-image.tar
          retention-days: 1
