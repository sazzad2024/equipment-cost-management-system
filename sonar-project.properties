# SonarQube Configuration for Equipment Cost Management System
# This file configures the SonarQube scanner for both frontend and backend

# Project identification
sonar.projectKey=equipment-cost-management-system
sonar.projectName=Equipment Cost Management System
sonar.projectVersion=1.0.0

# Source directories (both frontend and backend)
sonar.sources=backend/app,frontend/src

# Exclusions - files to skip during analysis
sonar.exclusions=**/node_modules/**,**/dist/**,**/static/**,**/*.spec.ts,**/*.test.js,**/coverage/**,**/.angular/**

# Test files (commented out - no test directories exist yet)
# sonar.tests=frontend/src
# sonar.test.inclusions=**/*.spec.ts,**/*.test.js

# TypeScript/JavaScript configuration
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Language-specific settings
sonar.typescript.tsconfigPath=frontend/tsconfig.json
